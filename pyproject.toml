[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jianwai-api"
version = "0.1.0"
description = "间外社区真实服务端"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.2",
  "SQLAlchemy==2.1.3",
  "alembic==1.20.0",
  "argon2-cffi==25.1.0",
  "pillow==12.3.0",
  "python-multipart==0.0.32",
  "python-dotenv==1.2.4",
  "psycopg[binary]==3.3.6",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx2==2.13.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
