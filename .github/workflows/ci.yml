name: API CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: jianwai_test
          POSTGRES_USER: jianwai_test
          # Disposable CI service only; never used by deployment.
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jianwai_test -d jianwai_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://jianwai_test:ci-only-password@localhost:5432/jianwai_test' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - name: Verify migrations on a clean database
        env:
          DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://jianwai_test:ci-only-password@localhost:5432/jianwai_test' || 'sqlite:///./var/migration.db' }}
        run: |
          mkdir -p var
          alembic upgrade head
          alembic current
          alembic downgrade base
          alembic upgrade head
      - name: Run identical contract and authorization suite
        run: pytest -q
      - name: Build API container
        if: matrix.database == 'sqlite'
        run: docker build -t jianwai-api:ci .
